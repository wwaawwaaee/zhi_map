[project]
name = "zhishu-backend"
version = "2.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic>=2.9", "pydantic-settings>=2.4", "SQLAlchemy>=2.0", "alembic>=1.13", "httpx>=0.27", "cryptography>=43"]

[project.optional-dependencies]
test = ["pytest>=8"]
desktop = ["pywebview>=6.2", "pyinstaller>=6.11", "pywin32>=306; sys_platform == 'win32'"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["app", "app.domain"]

[tool.alembic]
script_location = "alembic"
