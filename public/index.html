<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知径 · 让好奇有迹可循</title><link rel="stylesheet" href="/vendor/katex.css"><link rel="stylesheet" href="/style.css"></head>
<body>
  <a class="skip" href="#draft">跳到输入框</a>
  <nav class="sidebar" aria-label="学习主题"><a class="brand" href="/">知径 <span>把问题想明白</span></a><button id="create" class="primary">＋ 新的学习问题</button><label class="nav-label" for="tag-filter">我的路径</label><select id="tag-filter" aria-label="按标签筛选"></select><div id="tree"></div><div class="sidebar-bottom"><span id="connection">连接中…</span><button id="settings-button">设置与数据 ↗</button></div></nav>
  <main class="workspace"><header class="topbar"><button id="nav-toggle" aria-label="切换主题导航" aria-expanded="false">☰</button><span class="top-title">学习空间</span><div class="top-actions"><button id="related-button">相关主题</button><button id="context-button">上下文</button><button id="manage-button" aria-label="管理当前主题">•••</button></div></header><section class="chat" aria-label="当前讨论"><div id="chat-header"></div><div id="messages"></div></section><div class="bottom"><div id="history-gate" hidden></div><div id="request-status" hidden></div><form id="composer" hidden><label for="draft">继续这条思路</label><textarea id="draft" rows="2" placeholder="写下你的问题…"></textarea><div class="composer-bottom"><span>Ctrl / ⌘ + Enter 发送</span><button id="send" class="primary" type="submit">发送 ↑</button></div></form><div class="storagebar"><span id="storage-status" role="status"></span><button id="retry" hidden>重试保存</button></div></div></main>
  <button id="expand-selection" class="primary selection-tool" hidden>展开讨论 ↗</button><div id="notice" role="status" aria-live="polite"></div><div id="undo-bar" hidden>已移除 · 下次修改前可撤销 <button id="undo">撤销</button></div>
  <dialog id="modal" aria-labelledby="modal-title"><div class="modal-head"><h2 id="modal-title"></h2><button id="close-modal" aria-label="关闭抽屉">✕</button></div><div id="modal-body"></div><p id="modal-error" role="alert"></p><div id="modal-actions"></div></dialog><script type="module" src="/app.mjs"></script>
</body></html>
